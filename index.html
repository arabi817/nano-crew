<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1219">
<title>어몸어스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="student" data-phase="lobby">

<div id="mode-badge" class="mode-badge" hidden>혼자 시험 모드</div>

<!-- 1. 방 코드 -->
<section id="page-join" class="screen-page bg-body" hidden>
  <div class="join-wrap">
    <h1 class="logo">어몸어스<small>몸속 대작전 · 동물과 에너지</small></h1>
    <!-- 고르기: 선생님과 / 친구들끼리 -->
    <div id="join-choose" class="metal join-box">
      <button id="go-back-room" class="btn btn-green press join-big" hidden></button>
      <button id="go-teacher" class="btn btn-yellow press join-big">선생님과 함께하기</button>
      <button id="go-friends" class="btn btn-gray press join-big">친구들끼리 하기</button>
    </div>
    <div id="join-friends" class="metal join-box" hidden>
      <div class="join-label">친구들끼리 하기</div>
      <button id="btn-make" class="btn btn-yellow press join-big">방 만들기 <small>내가 방장</small></button>
      <button id="btn-friend-join" class="btn btn-gray press join-big">친구 방 들어가기 <small>방 코드 넣기</small></button>
      <p id="make-msg" class="msg"></p>
      <button class="join-back press" type="button">← 처음으로</button>
    </div>
    <form id="code-form" class="metal join-box" hidden>
      <label for="code-input" class="join-label">방 코드</label>
      <input id="code-input" class="code-input" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
      <button class="btn btn-yellow press" type="submit">들어가기</button>
      <p id="code-msg" class="msg"></p>
      <button class="join-back press" type="button">← 처음으로</button>
    </form>
  </div>
  <details class="credit"><summary>정보</summary><p>원작 · Among Us<br>제작 · 유락여중 김여진 선생님과 AI 친구들</p></details>
</section>

<!-- 2. 닉네임 (색깔 + 번호) -->
<section id="page-pick" class="screen-page bg-body" hidden>
  <div class="pick-wrap">
    <div class="pick-left metal">
      <div id="pick-preview" class="pick-preview"></div>
      <div id="pick-name" class="pick-name"></div>
      <button id="pick-go" class="btn btn-yellow press" disabled>이 탐사대원으로 입장</button>
    </div>
    <div class="pick-right metal">
      <h2 class="pick-h">1. 이름 <small>실명은 쓰지 마세요 · 8글자까지 · 한글·영어·숫자</small></h2>
      <input id="name-input" class="name-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="닉네임">
      <p id="pick-msg" class="msg name-msg"></p>
      <h2 class="pick-h">2. 색깔 <small>친구와 같은 색이어도 괜찮아요</small></h2>
      <div id="color-grid" class="color-grid"></div>
    </div>
  </div>
</section>

<!-- 3. 게임 -->
<section id="page-game" class="screen-page" hidden>
  <div id="phaser"></div>
  <div id="hud">
    <div id="arrows"></div>
    <div class="hud-tl only-lobby"><div id="lobby-settings" class="metal-dark set-box"></div></div>
    <div class="hud-tl only-play">
      <div class="tasks metal-dark">
        <div class="tasks-head">미션</div>
        <ul id="task-list"></ul>
        <div id="sab-line" class="sab-line" hidden></div>
      </div>
    </div>
    <div class="hud-top">
      <div class="pbar only-play"><span class="pbar-label">전체 미션</span><div class="pbar-track"><div id="pbar-fill" class="pbar-fill"></div></div></div>
      <div id="lobby-banner" class="lobby-banner only-lobby"></div>
    </div>
    <div class="hud-tr">
      <button id="btn-hat" class="ibtn press only-lobby"></button>
      <button id="btn-map" class="ibtn press"></button>
    </div>
    <div id="joy-zone"></div>
    <div class="hud-br only-play">
      <div class="imp-col only-imp-any">
        <button id="btn-sab" class="abtn abtn-sab press"></button>
        <button id="btn-vent" class="abtn abtn-vent press only-imp" disabled></button>
      </div>
      <button id="btn-kill" class="abtn abtn-kill press only-imp" disabled></button>
      <button id="btn-report" class="abtn abtn-red press" disabled></button>
      <button id="btn-use" class="abtn abtn-use press" disabled></button>
    </div>
    <div id="sab-banner" class="sab-banner" hidden></div>
    <div id="conn-banner" class="conn-banner" hidden>연결이 끊겼어요 · 다시 연결하는 중...</div>
    <div id="toasts" class="toasts"></div>
    <div id="debug" class="debug" hidden></div>
  </div>
  <div class="rotate-hint">패드를 가로로 돌리면 더 넓게 보여요</div>
</section>

<!-- 알림 -->
<div id="notice" class="mpanel-ov" hidden>
  <div class="sheet metal notice">
    <div class="mpanel-title" id="notice-title"></div>
    <p id="notice-text"></p>
    <button id="notice-btn" class="btn btn-yellow press"></button>
  </div>
</div>

<!-- 방장 칸 (친구들끼리 하기에서 방을 만든 학생만, 대기실·판 끝에) -->
<div id="host-box" class="host-box metal-dark" hidden></div>
<div id="host-gone" class="host-gone" hidden>방장이 나갔어요 · 방장이 다시 들어오면 이어져요</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
