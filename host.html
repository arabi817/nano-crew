<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어몸어스 · 교사 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/host.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body class="host bg-body" data-view="start" data-hv="lobby">

<div id="mode-badge" class="mode-badge" hidden>혼자 시험 모드</div>

<!-- 시작 -->
<section class="view view-start">
  <h1 class="logo">어몸어스<small>교사 화면 (TV)</small></h1>
  <div class="start-btns">
    <button id="btn-new" class="btn btn-yellow press big">새 방 만들기</button>
    <button id="btn-resume" class="btn btn-gray press big" hidden></button>
  </div>
  <p id="start-msg" class="msg"></p>
  <details class="credit"><summary>정보</summary><p>원작 · Among Us<br>제작 · 유락여중 김여진 선생님과 AI 친구들</p></details>
</section>

<!-- 방 -->
<section class="view view-room">
  <header class="h-bar">
    <div class="h-title">어몸어스</div>
    <div class="h-phase" id="h-phase">대기 중</div>
    <button id="btn-mute" class="btn btn-gray press h-mute">소리 켜짐</button>
    <div class="h-code">방 코드 <b id="h-code">----</b></div>
  </header>

  <!-- 대기 중 -->
  <div class="lobby-grid hv-lobby">
    <div class="qr-card metal">
      <canvas id="qr"></canvas>
      <div class="qr-local" id="qr-local" hidden>
        <p>혼자 시험 모드에서는<br>이 컴퓨터의 창으로만 들어올 수 있어요.</p>
        <button id="btn-open-student" class="btn btn-yellow press">학생 창 열기</button>
      </div>
      <div class="qr-code" id="qr-code">----</div>
      <div class="qr-url" id="qr-url"></div>
      <div id="host-settings" class="set-box host-set"></div>
      <div id="set-steps"></div>
      <div class="imp-note">바이러스 수는 참가자가 적으면 시작할 때 자동으로 줄어요 (참가자 절반 미만)</div>
      <button id="btn-map" class="btn btn-gray press">맵: 작은 맵</button>
      <button id="btn-vision" class="btn btn-gray press">시야: 넓게</button>
      <button id="btn-chatmode" class="btn btn-gray press">채팅: 정해진 문장</button>
    </div>
    <div class="roster metal">
      <div class="roster-head"><span>접속한 탐사대원</span><b id="roster-count">0명</b></div>
      <div id="roster" class="roster-list"></div>
    </div>
  </div>

  <!-- 게임 중: 학생 위치는 절대 보여 주지 않아요 -->
  <div class="play-view hv-play">
    <div class="big-progress metal" id="bp-box">
      <div class="bp-label">전체 미션 진행</div>
      <div class="bp-track"><div id="bp-fill" class="bp-fill"></div></div>
      <div class="bp-num" id="bp-num">0%</div>
    </div>
    <div class="bp-note" id="bp-note"></div>
    <div class="play-stats">
      <div class="stat metal"><span>살아 있는 대원</span><b id="st-alive">0</b></div>
      <div class="stat metal"><span>남은 바이러스</span><b id="st-imp">-</b></div>
    </div>
    <div id="sabotage" class="sabotage" hidden></div>
  </div>

  <!-- 회의 중 -->
  <div class="meet-view hv-meet">
    <div class="hm-top">
      <div class="hm-title" id="hm-title"></div>
      <div class="hm-phase" id="hm-phase"></div>
      <div class="hm-time" id="hm-time"></div>
    </div>
    <div class="hm-ctrl">
      <div class="hm-who" id="hm-who"></div>
      <button id="hm-hand" class="btn btn-gray press">손들기 방식: 끔</button>
      <button id="hm-more" class="btn btn-gray press">토론 +30초</button>
    </div>
    <div class="hm-speak" id="hm-speak"></div>
    <div class="hm-ox metal" id="hm-ox"></div>
    <div class="hm-body">
      <div class="hm-grid" id="hm-grid"></div>
      <div class="hm-chat metal-dark" id="hm-chat"></div>
    </div>
    <div class="hm-eject" id="hm-eject"></div>
  </div>

  <!-- 종료 후 -->
  <div class="end-view hv-ended">
    <div class="ev-big" id="ev-big"></div>
    <div class="ev-reason" id="ev-reason"></div>
    <div class="ev-grid" id="ev-grid"></div>
  </div>

  <footer class="h-foot">
    <button id="btn-start" class="btn btn-green press hv-lobby">게임 시작</button>
    <button id="btn-pause" class="btn btn-yellow press hv-play hv-meet">일시정지</button>
    <button id="btn-force" class="btn btn-red press hv-play">강제 회의</button>
    <button id="btn-people" class="btn btn-gray press hv-play hv-meet">참가자 · 내보내기</button>
    <button id="btn-again" class="btn btn-green press hv-ended">새 판 (대기실로)</button>
    <button id="btn-bots" class="btn btn-gray press hv-lobby">봇 30명 붙이기 (시험용)</button>
    <button id="btn-end" class="btn btn-red press">판 종료 (방 삭제)</button>
  </footer>
</section>

<script type="module" src="js/host.js"></script>
</body>
</html>
